# Each backend gets identical limits: 1 CPU, 512 MB. Build context = repo root.
# Host ports 4101+. Backends whose Dockerfile does not exist yet are commented out;
# enable each once that backend merges.
x-limits: &limits
  cpus: "1.0"
  mem_limit: 512m

services:
  node-ts:
    build: { context: .., dockerfile: backends/node-ts/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: /data/notes.db }
    ports: ["4101:3000"]
    tmpfs: ["/data"]

  # deno:   # enable once backends/deno merges (needs backends/deno/Dockerfile based on denoland/deno)
