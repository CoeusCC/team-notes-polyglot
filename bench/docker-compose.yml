# Each backend gets identical limits: 1 CPU, 512 MB. Build context = repo root.
# Host ports 4101+. Backends whose Dockerfile does not exist yet are commented out;
# enable each once that backend merges.
x-limits: &limits
  cpus: "1.0"
  mem_limit: 512m

services:
  node-ts:
    build: { context: .., dockerfile: backends/node-ts/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: /data/notes.db }
    ports: ["4101:3000"]
    tmpfs: ["/data"]

  deno:
    build: { context: .., dockerfile: backends/deno/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: /data/notes.db }
    ports: ["4102:3000"]
    tmpfs: ["/data"]

  php:   # PHP_CLI_SERVER_WORKERS=4 set in the Dockerfile
    build: { context: .., dockerfile: backends/php/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: /data/notes.db }
    ports: ["4103:3000"]
    tmpfs: ["/data"]

  python:
    build: { context: .., dockerfile: backends/python/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: /data/notes.db }
    ports: ["4104:3000"]
    tmpfs: ["/data"]

  rust:
    build: { context: .., dockerfile: backends/rust/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: /data/notes.db }
    ports: ["4106:3000"]
    tmpfs: ["/data"]

  dotnet:
    build: { context: .., dockerfile: backends/dotnet/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: ":memory:" }
    ports: ["4107:3000"]

  go:
    build: { context: .., dockerfile: backends/go/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: ":memory:" }
    ports: ["4108:3000"]

  java:
    build: { context: .., dockerfile: backends/java/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: ":memory:" }
    ports: ["4109:3000"]

  bun:
    build: { context: .., dockerfile: backends/bun/Dockerfile }
    <<: *limits
    environment: { PORT: "3000", DB_PATH: ":memory:" }
    ports: ["4110:3000"]
